name: rootfs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install debootstrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            debootstrap qemu-user-static e2fsprogs

      - name: build rootfs
        run: |
          set -e
          sudo mkdir -p /srv/rootfs
          sudo debootstrap --arch=riscv64 --foreign --variant=minbase \
            trixie /srv/rootfs http://deb.debian.org/debian
          sudo cp /usr/bin/qemu-riscv64-static /srv/rootfs/usr/bin/
          sudo chroot /srv/rootfs /usr/bin/qemu-riscv64-static \
            /bin/sh /debootstrap/debootstrap --second-stage

      - name: configure init + getty + login
        run: |
          set -e
          sudo cp /etc/resolv.conf /srv/rootfs/etc/resolv.conf

          sudo chroot /srv/rootfs /usr/bin/qemu-riscv64-static /bin/bash -ec "
            apt-get update
            apt-get install -y --no-install-recommends sysvinit-core ifupdown isc-dhcp-client iproute2 iputils-ping curl wget ca-certificates e2fsprogs
            echo 'root:root' | chpasswd
            echo 'T0:23:respawn:/sbin/getty -L -a root ttyS0 115200 vt100' >> /etc/inittab
            echo 'rvm' > /etc/hostname
            echo '/dev/vda / ext4 defaults,nofail 0 0' > /etc/fstab
            echo 'proc /proc proc defaults 0 0' >> /etc/fstab
            echo 'sysfs /sys sysfs defaults 0 0' >> /etc/fstab
          "

      - name: keep shadow aging off the console
        run: |
          set -e
          sudo sed -i -E 's/^([^:]+):([^:]*):[0-9]+:/\1:\2::/' /srv/rootfs/etc/shadow
          sudo grep -qE '^root:[^:]*::' /srv/rootfs/etc/shadow
          echo "shadow: last-change field cleared, so no account is dated in the future"

      - name: configure eth0 through the built-in NAT
        run: |
          set -e

          sudo tee /srv/rootfs/etc/network/interfaces > /dev/null <<'IFACES'
          auto lo
          iface lo inet loopback

          auto eth0
          iface eth0 inet manual
          IFACES

          sudo rm -f /srv/rootfs/etc/resolv.conf
          sudo tee /srv/rootfs/etc/resolv.conf > /dev/null <<'RESOLV'
          nameserver 10.0.2.3
          options timeout:1 attempts:2
          RESOLV

          sudo grep -q "getty -L -a root ttyS0" /srv/rootfs/etc/inittab

          sudo chroot /srv/rootfs /usr/bin/qemu-riscv64-static /bin/bash -ec '
            test -x /etc/init.d/networking
            ls /etc/rcS.d/S*networking > /dev/null
            command -v dhclient ip apt resize2fs > /dev/null
            grep -q "^auto eth0" /etc/network/interfaces
            grep -q "^iface eth0 inet manual" /etc/network/interfaces
            test -f /etc/resolv.conf
            grep -q 10.0.2.3 /etc/resolv.conf
          '

      - name: keep a manual dhclient short
        run: |
          set -e

          sudo tee /srv/rootfs/etc/dhcp/dhclient.conf > /dev/null <<'DHCPC'
          timeout 15;
          retry 5;
          reboot 3;
          backoff-cutoff 2;
          initial-interval 2;
          request subnet-mask, routers, domain-name-servers, host-name;
          DHCPC

          sudo chroot /srv/rootfs /usr/bin/qemu-riscv64-static /bin/bash -ec '
            grep -q "^timeout 15;" /etc/dhcp/dhclient.conf
            out=$(dhclient -t 1 -cf /etc/dhcp/dhclient.conf 2>&1 || true)
            case "$out" in
              *semicolon*|*Expecting*|*syntax*|*unexpected*) echo "dhclient.conf: $out"; exit 1 ;;
            esac
          '

      - name: enable networking at boot
        run: |
          set -e

          sudo rm -f /srv/rootfs/usr/sbin/policy-rc.d
          sudo chroot /srv/rootfs /usr/bin/qemu-riscv64-static /bin/sh -c \
            'update-rc.d -f networking start 20 S . stop 20 0 1 6 .'
          sudo ls /srv/rootfs/etc/rcS.d | grep networking

      - name: build disk.img
        run: |
          set -e
          sudo dd if=/dev/zero of=/srv/disk.img bs=1M count=2048
          sudo mkfs.ext4 -F -L rootfs /srv/disk.img
          sudo mkdir -p /mnt/rootfs
          sudo mount -o loop /srv/disk.img /mnt/rootfs
          sudo cp -a /srv/rootfs/* /mnt/rootfs/
          sudo umount /mnt/rootfs
          sudo gzip -k /srv/disk.img
          ls -la /srv/disk.img.gz

      - uses: actions/upload-artifact@v4
        with:
          name: disk-img
          path: /srv/disk.img.gz
          retention-days: 30

      - name: publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: /srv/disk.img.gz
          fail_on_unmatched_files: false
